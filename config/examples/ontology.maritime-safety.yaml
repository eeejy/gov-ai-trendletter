# ─────────────────────────────────────────────────────────────
# 예시: 해양 안전·치안 분야 기관에 맞춘 온톨로지
#
# `config/ontology.yaml` 로 복사해 쓰거나, 자기 기관 업무에 맞게 고쳐 쓴다.
# 핵심은 세 가지다.
#   1) work_relevance — "우리 기관이 이걸 쓸 자리가 있나" 를 판정하는 관점들
#   2) priority_topics — 무조건 우대할 최상위 정책 주제
#   3) axes — 분류·집계에 쓰는 내부 축
#
# 가중치는 임의로 정하지 말고, **지난 발행본을 분석해** 실제로 무엇을 실었는지
# 그 분포에 맞춰 정하는 것이 좋다. (docs/pipeline.md 참고)
# ─────────────────────────────────────────────────────────────

# 해양경찰 업무 온톨로지와 관련도 키워드
#
# 2026-08-30: 제2026-1~11호에 실제로 실린 57개 항목을 분석해 다시 작성했다.
# 업무 영역별 실제 비중은 아래와 같았다. 가중치는 이 비중을 따른다.
#
#   행정·기획      53%   ← 문서·보고·민원·조직운영이 압도적
#   교육·인재      37%   ← 경진대회·교육과정·역량강화
#   정보화·인프라   25%   ← GPU·클라우드·데이터·시스템 구축
#   경비·안전      16%
#   수색구조       11%
#   해상교통관제     7%
#   수사·정보       4%
#   해양오염방제     2%
#
# 즉 "AI를 바다에서 어떻게 쓰나" 보다 "조직이 AI를 어떻게 들이나" 가 훨씬 많다.
# 현업 키워드만 보면 관련 이슈를 거의 놓친다.

axes:

  기관:
    국가AI전략위원회: [국가AI전략위, 국가인공지능전략위원회, 공공AX분과, 전략위]
    과학기술정보통신부: [과기정통부, 과기부, 과학기술정보통신부, NIA, 한국지능정보사회진흥원, IITP]
    행정안전부: [행안부, 행정안전부, 국가정보자원관리원]
    해양경찰청: [해양경찰청, 해경청, 해양경찰, 우리청, AI미래융합단, 인공지능전환팀]
    해양수산부: [해양수산부, 해수부, 해양환경공단, 선박안전기술공단]
    경찰청: [경찰청, 국가수사본부, 경찰대학]
    소방청: [소방청, "119", 중앙119구조본부, 소방청장]
    유사기관: [국방부, 관세청, 산림청, 기상청, 국가유산청, 국무조정실, 법무부, 병무청, 해양환경공단]
    지자체: [서울시, 부산시, 인천시, 지방자치단체, 광역시, 특별자치도]
    기업: [삼성, SK, LG, 네이버, 카카오, KT, 엔비디아, 오픈AI, 구글, 앤트로픽, 메타, 지푸]

  정책·사업:
    전략·계획: [기본계획, 종합계획, 로드맵, 추진전략, 행동계획, 정책방향, 마스터플랜]
    법·제도: [법률, 시행령, 고시, 지침, 가이드라인, 윤리원칙, 규제, 표준, 인증, 조례]
    예산·사업: [공모, 예산, 시범사업, 실증, 과제, 발주, 사업계획, 선정, 예타, 투입]
    조직·인력: [전담조직, 조직개편, 인력양성, 정원, 직제, 채용, TF, 전담반]
    데이터·인프라: [데이터센터, GPU, 클라우드, 데이터개방, 공공데이터, AI허브, 국가망, 망분리]

  기술·도구:
    언어모델: [LLM, 대규모언어모델, 파운데이션모델, sLM, 소버린, 초거대, 생성형]
    에이전트: [에이전트, agent, MCP, 자동화, 워크플로, 코파일럿, 어시스턴트]
    멀티모달: [영상분석, 음성인식, STT, TTS, 이미지생성, 비전, 객체인식, 무전, 통화]
    개발도구: [코딩어시스턴트, IDE, 오픈소스, 파인튜닝, RAG, API, 노코드]
    보안·신뢰: [보안, 프롬프트인젝션, 딥페이크, 환각, 검증, 개인정보, 유출, 윤리]
    피지컬AI: [로봇, 드론, 무인기, 자율운항, 자율주행, 웨어러블, 스마트워치, 센서]

  업무 분야:
    수색구조: [수색, 구조, 실종, 조난, 표류, 인명, 골든타임, 구조대, 익수, 침몰, 좌초]
    해상교통관제: [VTS, 관제, 항행, 선박모니터링, 항만, 입출항, 해상교통, 충돌위험]
    해양오염방제: [방제, 유출, 오염, 해양환경, 기름, 폐기물, 적조, 해양정화]
    수사·정보: [수사, 단속, 밀입국, 밀수, 불법조업, 정보분석, 증거, 범죄, 마약]
    경비·안전: [경비, 순찰, 함정, 항공, 안전관리, 재난, 사고예방, 구명, 안전점검]
    행정·기획: [문서, 보고서, 공문, 민원, 인사, 예산, 기획, 결재, 회의록, 행정혁신, 업무효율]
    교육·인재: [교육, 경진대회, 해커톤, 공모전, 역량, 양성, 연수, 실습, 챔피언, 아이디어]
    정보화·인프라: [정보화, 시스템구축, 전산, 네트워크, 서버, 통신망, 재난망, 정보화사업]

# ── 최우선 주제 ─────────────────────────────────────────────
# 국가AI전략위원회는 범정부 AI 정책의 최상위 방향을 정하므로 항상 우대한다.
#
# 다만 **수집원이 아니라 내용으로 판정한다.** 정책브리핑 검색은 본문 전문검색이라
# "국가인공지능전략위원회" 로 검색해도 그 낱말이 본문 어딘가에 있으면 다 걸린다
# (2026-08-30 확인: 4건 중 3건이 규제혁신 간담회·국제개발협력위 등 무관한 자료).
# 그래서 어느 수집원으로 들어오든 아래 표현이 있으면 가산한다.
priority_topics:
  국가AI전략위:
    title_weight: 5.0      # 제목에 있으면
    body_weight: 2.0       # 본문에만 있으면
    keywords:
      - 국가AI전략위
      - 국가인공지능전략위
      - AI전략위원회
      - 공공AX분과
      - 공공AX
      - AI 액션플랜
      - AI기본계획
      - AI 기본계획
      - 국가 AI 전략
      - 인공지능 기본계획

# ── 업무 관련도 ─────────────────────────────────────────────
# "기사에 바다 낱말이 있나" 가 아니라 "우리청이 이걸 쓸 자리가 있나" 로 본다.
# 지난 11개호에서 실제로 고른 주제의 성격을 그대로 옮겼다.
work_relevance:

  # 우리청 직접 언급 — 무조건 최우선
  직접:
    weight: 6.0
    keywords: [해양경찰, 해경청, 해경, 우리청, AI미래융합단, 인공지능전환팀]

  # 유사기관 — 경찰청·소방청 둘뿐이다.
  # 같은 현장 집행기관이라 사업 근거와 구축 방식을 그대로 가져다 쓸 수 있다.
  # 지난 11개호에서도 소방청 3건·경찰청 1건이 실렸다.
  유사기관:
    weight: 4.0
    keywords: [경찰청, 소방청, "119", 국가수사본부, 소방, 치안]

  # 인접기관 — 해양수산부 하나. 우리청과 업무가 직접 맞닿아 있다.
  인접기관:
    weight: 2.5
    keywords: [해양수산부, 해수부]

  # 그 밖의 기관 — 공공 AI 도입 사례로서만 참고한다. 업무 연결은 약하다.
  # 국방부·관세청·해양환경공단·산림청·기상청·지자체 등이 모두 여기 들어간다.
  타기관사례:
    weight: 1.2
    keywords: [국방부, 방위사업청, 관세청, 해양환경공단, 산림청, 기상청,
               국가유산청, 병무청, 조달청, 국세청, 농촌진흥청, 질병관리청,
               법제처, 지식재산처, 교육부, 국토교통부, 문화체육관광부,
               지방자치단체, 광역시, 특별자치도, 특별시]

  # 공공부문 AI 전환 — 우리청이 곧 겪을 일. 지난 호에서 가장 많이 실린 유형
  공공전환:
    weight: 3.0
    keywords: [공공부문, 공공기관, 공무원, 행정혁신, 정부혁신, 전자정부, 공공AX,
               업무자동화, 문서작성, 보고서, 공문서, 민원, 결재, 행정업무,
               가이드라인, 윤리원칙, 도입기준, 활용지침, 보안수칙,
               # 서울 AI 플랫폼으로 들어오는 해외 정책자료는 영어 제목이라
               # 한글 낱말에 하나도 걸리지 않았다. OECD 「공공기관 생성형 AI
               # 사용 지침」이 업무 관련도 0점이었다(2026-08-30).
               "government use", "public sector", "public service",
               "government ai", "civil service", "guidance on", "policy framework",
               "ai office", "digital government", "public administration"]

  # 인재·교육 — 지난 호 37%. 경진대회·해커톤·교육과정
  인재교육:
    weight: 2.5
    keywords: [경진대회, 해커톤, 공모전, 인재양성, 교육과정, 역량강화, 직원교육,
               우수사례, 아이디어, 실습, 연수, 챔피언, 확산]

  # 현장 임무 (해양 전용 낱말) — 이 말이 나오면 맥락을 볼 필요가 없다
  현장임무:
    weight: 4.0
    keywords: [VTS, 해상교통관제, 방제, 해양오염, 불법조업, 밀입국, 함정, 자율운항,
               해상수색, 해난, 조난, 익수, 연안, 영해, 해양사고, 선박안전]

  # 현장 적용 가능 기술 — 일반 낱말이라 해양 맥락이 함께 있을 때만 센다.
  # ('제주 실종' 같은 일반 기사가 현장임무로 잡히는 것을 막는다)
  현장기술:
    weight: 3.0
    context: [해상, 해양, 바다, 선박, 항만, 해역, 연안, 수상, 해경, 함정, 재난, 구조대, 소방, 경찰]
    keywords: [수색, 구조, 실종, 순찰, 항공, 드론, 무인기, 웨어러블, 스마트워치,
               무전, 음성인식, 영상분석, 객체인식, 위치추적, 관제, 긴급대응]

  # 인프라·예산 — 사업 추진 근거가 되는 정보
  인프라:
    weight: 2.0
    keywords: [GPU, 데이터센터, 클라우드, 국가망, 망분리, 예산, 공모, 사업자선정,
               실증, 시범사업, 구축, 발주, 예타]
