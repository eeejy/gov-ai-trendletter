# 회차 기본 설정. 로컬 웹 편집기에서 회차마다 덮어쓸 수 있다.

# 발행 기관 정보. 쓰는 기관에 맞게 바꾼다.
issue:
  series: "AI 정보동향지"
  publisher: ○○기관          # 예: 해양경찰청
  team: 인공지능전환팀         # 예: 인공지능전환팀 / 정보화담당관
  year: 2026
  number: null            # null 이면 data/issues 의 마지막 호 + 1
  weekday_label: 금        # 발행 요일 표기

collect:
  days: 7                 # 기본 수집 기간 (최근 7일)
  max_per_source: 60
  timeout: 25
  user_agent: "KCG-TrendLetter/0.1 (+internal use)"
  cache_hours: 6          # 같은 URL 재수집 방지

compose:
  total_max: 6            # 전체 최대 6건
  quota:                  # 트랙별 목표 건수 (min, max)
    # 지난 11개호는 기관 동향·정부정책이 절반 이상이었다.
    # 개발자 트랙은 종합 항목 1건으로 충분해 상한을 1로 둔다.
    policy: [3, 4]
    industry: [2, 3]
    dev: [0, 1]
  must_include_roles: [must]   # 점수와 무관하게 후보에 자동 포함
  # 개발자 트랙은 여러 플랫폼에서 같은 이름이 확인될 때만 싣는다.
  # 한 곳에서만 보이는 저장소는 그 주의 핵심 기술이 아니라 그날의 화젯거리다.
  dev_min_platforms: 2
  # 새 모델·도구 소식은 매 호 최소 이만큼 남긴다.
  # 정책·공공 이슈만 채우면 '무슨 도구가 나왔는지' 를 아예 놓친다.
  min_tool_news: 1
  # 이번 주 가장 많이 언급된 기술·모델은 개별 기사가 아니라
  # '조사·종합 정리' 항목으로 싣는다. 개발자 개인 게시글 요약이 되지 않도록.
  topic_slots: 1
  topic_min_mentions: 3

# AI 정보동향지이므로 AI와 무관한 자료는 아무리 우리청 관련성이 높아도 싣지 않는다.
# (해양경찰청 보도자료 게시판처럼 전체 보도자료를 가져오는 소스가 있어 반드시 필요하다.)
filter:
  require_ai: true
  # core  : 이 말이 제목에 있으면 AI 기사로 본다
  # adjacent: 단독으로는 부족하고 본문에 core 가 함께 있어야 한다
  ai_core:
    [AI, A.I., 인공지능, 머신러닝, 딥러닝, 생성형, 초거대, 언어모델, 챗봇,
     LLM, GPT, 에이전트, 파운데이션모델, 소버린]
  ai_adjacent:
    [지능형, 알고리즘, 데이터센터, 디지털전환, 자율운항, 무인, 반도체,
     GPU, 클라우드, 로봇, 빅데이터, 디지털트윈,
     # 2026-08-30 오탈락 사례를 보고 추가.
     # 'K-기상예측모델', '데이터관계장관회의' 가 제목에 AI 가 없어 걸러졌다.
     예측모델, 수치예보, 공공데이터, 데이터개방, 데이터관계, 학습데이터,
     초거대, 자동화, 판독, 영상분석, 음성인식]

# 초안 작성. Claude Code CLI 를 그대로 쓴다(별도 API 키 없음).
llm:
  enabled: true
  command: claude
  model: ""          # 비우면 Claude Code 기본 모델
  timeout: 180       # 항목 1건당 초
  max_items: 8       # 한 번에 초안을 만들 최대 항목 수

# 관련 영상. 공식 API 가 아니라 검색 결과 페이지를 읽으므로 실패해도 넘어간다.
youtube:
  enabled: true
  max_per_item: 2
  # 영상은 필수가 아니다. 관련도가 확실하지 않으면 그 항목에는 아예 붙이지 않는다.
  # 'AI·모델·사용' 같은 상용어는 겹쳐도 세지 않는다(youtube._COMMON).
  min_overlap: 3     # 상용어를 뺀 낱말이 이만큼 겹쳐야 인정
  max_age_days: 45   # 이보다 오래된 영상은 뺀다. 대체 영상을 억지로 넣지 않는다
  strong_overlap: 4  # 이만큼 겹치면 같은 사업·행사를 다룬 것으로 보고 나이는 넘어간다

dedupe:
  title_similarity: 0.72  # 이 값 이상이면 같은 이슈로 통합
  window_days: 10
  # 제목 유사도만으로는 영어 기사가 안 묶인다. 같은 모델·도구 이름을 다루면
  # 한 사건으로 합친다. (2026-08-30: GLM 관련 소식이 7개 이슈로 흩어졌음)
  merge_by_entity: true
  entity_min_similarity: 0.30

output:
  # 글꼴은 발행물 안에 쓰인 글자만 잘라 담는다 (assets/fonts/README.md)
  #   display: 표지 큰 제목·항목 제목·배지  (paperlogy | pretendard)
  #   body   : 본문 개조식·시사점·관련자료  (pretendard | paperlogy)
  # Paperlogy 는 발표용으로 만들어져 큰 글자에 어울리고,
  # Pretendard 는 숫자·괄호가 많은 본문에서 줄이 고르게 앉는다.
  display_font: paperlogy
  body_font: pretendard

  # 영상 썸네일을 파일 안에 담는다. 끄면 유튜브 서버에서 불러오므로
  # 폐쇄망·오프라인에서 깨지고, 파일을 그대로 주고받을 때도 안 보인다.
  embed_thumbnails: true

  html_dir: data/issues
  draft_dir: data/drafts
  raw_dir: data/raw

telegram:
  enabled: true
  max_items: 6
  # 토큰과 대상 방은 config/secrets.yaml 에 둔다 (git 제외).
  #   telegram:
  #     token: "123456:ABC-DEF..."
  #     chat_id: "-1001234567890"
  # 환경변수 TRENDLETTER_TELEGRAM_TOKEN / TRENDLETTER_TELEGRAM_CHAT_ID 도 된다.
  #
  # 발송할 때 HTML 전문 주소를 함께 붙인다. 모바일에서 바로 열린다.
  # 사내망 파일서버·그룹웨어 등 직원이 접근할 수 있는 주소를 적는다.
  html_base: ""        # 예: https://intra.example.go.kr/ai-trend/

editor:
  host: 127.0.0.1
  port: 8765
