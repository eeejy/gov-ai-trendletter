# config/secrets.yaml 로 복사해 쓴다. 이 파일은 저장소에 올라가지 않는다.
# 만드는 방법은 docs/telegram.md 참고.

telegram:
  token: "123456789:AAH-BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"

  # 직원들이 받아보는 그룹·채널 (그룹·채널은 음수)
  chat_id: "-1001234567890"

  # 담당자 본인. 초안 준비 알림이 전 직원에게 가지 않도록 나눠 둔다.
  # 비워 두면 위 chat_id 와 같은 방을 쓴다.
  admin_chat_id: "123456789"

# 환경변수로 줘도 된다.
#   TRENDLETTER_TELEGRAM_TOKEN
#   TRENDLETTER_TELEGRAM_CHAT_ID
#   TRENDLETTER_TELEGRAM_ADMIN_CHAT_ID
