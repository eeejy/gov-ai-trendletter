# 설치형 만들기 — 윈도우 .exe, 맥 .app
#
# PyInstaller 는 크로스 컴파일이 안 된다. 맥에서 윈도우 exe 를 만들 수 없고,
# 인텔용을 애플실리콘에서 만들 수도 없다. 그래서 각 러너에서 따로 만든다.
#
# README 가 GitHub Actions 를 배제한 것은 '초안을 액션에서 만들지 않는다'는
# 뜻이다. 검토 없이 나간 초안이 전 직원에게 갈 수 있기 때문이다.
# 여기서 하는 일은 빌드뿐이라 초안 유출과 무관하다. 수집도 하지 않고
# 설정 파일(secrets.yaml)도 저장소에 없다.

name: 설치형 만들기

on:
  # 태그를 밀면 만들어서 Releases 에 올린다.
  push:
    tags: ["v*"]
  # 여기에 밀면 만들어만 본다 (artifact 는 공개되지 않는다).
  # 다른 운영체제 빌드는 손으로 확인할 방법이 없어, 깨진 걸 태그 밀 때 알면 늦다.
  # paths 로 좁히지 않는다 — tags 와 함께 쓰면 태그 빌드가 조용히 건너뛰어진다.
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 실행 파일 만들기
        run: pyinstaller --noconfirm --clean installer/trendletter.spec

      - name: 제대로 나왔는지 확인
        shell: pwsh
        run: |
          $dir = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $dir) { throw "dist 에 아무것도 없습니다" }
          $exe = Get-ChildItem $dir.FullName -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "실행 파일이 없습니다" }
          # 이름이 ASCII 여야 한다. 한글이면 zip 안에서 깨져 못 연다.
          if ($exe.Name -notmatch '^[\x20-\x7E]+$') {
            throw "실행 파일 이름에 ASCII 가 아닌 글자가 있습니다: $($exe.Name)"
          }
          # 비밀 파일이 딸려 갔는지 본다. 한 번이라도 새면 되돌릴 수 없다.
          if (Get-ChildItem $dir.FullName -Recurse -Filter secrets.yaml) {
            throw "secrets.yaml 이 배포물에 들어 있습니다"
          }
          Write-Host "$($exe.Name)  $([math]::Round($exe.Length/1MB,1)) MB"
          "BUILD_DIR=$($dir.FullName)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: 압축
        shell: pwsh
        run: |
          # Compress-Archive 는 이름을 UTF-8 로 표시하지 않아, 안에 한글 이름이
          # 있으면 푸는 도구에 따라 깨진다. 인코딩을 직접 지정한다.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $env:BUILD_DIR, "$PWD/trendletter-windows.zip",
            [System.IO.Compression.CompressionLevel]::Optimal, $false,
            [System.Text.Encoding]::UTF8)
          Write-Host "zip $([math]::Round((Get-Item trendletter-windows.zip).Length/1MB,1)) MB"

      - uses: actions/upload-artifact@v5
        with:
          name: trendletter-windows
          path: trendletter-windows.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # 애플실리콘 (M1 이후)
            arch: arm64
          - runner: macos-15-intel  # 인텔 맥
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 앱 만들기
        run: pyinstaller --noconfirm --clean installer/trendletter.spec

      - name: 제대로 나왔는지 확인
        run: |
          set -e
          APP=$(find dist -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "dist 에 .app 이 없습니다"; exit 1; }
          BIN="$APP/Contents/MacOS/trendletter"
          [ -x "$BIN" ] || { echo "실행 파일이 없습니다: $BIN"; exit 1; }
          # 비밀 파일이 딸려 갔는지 본다. 한 번이라도 새면 되돌릴 수 없다.
          if find "$APP" -name secrets.yaml -o -name '.env' | grep -q .; then
            echo "비밀 파일이 배포물에 들어 있습니다"; exit 1
          fi
          # 만들려던 칩이 맞는지. 러너가 바뀌면 조용히 다른 게 나온다.
          GOT=$(lipo -archs "$BIN")
          WANT=$([ "${{ matrix.arch }}" = "intel" ] && echo x86_64 || echo arm64)
          [ "$GOT" = "$WANT" ] || { echo "칩이 다릅니다: $GOT (기대 $WANT)"; exit 1; }
          echo "$APP  $GOT  $(du -sh "$APP" | cut -f1)"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: 서명
        run: |
          # 서명이 없으면 Gatekeeper 가 아예 막는다. 자체 서명이라도 해 두면
          # '확인되지 않은 개발자' 를 한 번 허용하고 계속 쓸 수 있다.
          codesign --force --deep --sign - "$APP" && echo "자체 서명 완료" \
            || echo "서명 실패 — 여는 방법은 릴리스 안내에 적혀 있다"

      - name: 압축
        run: |
          # .app 안에는 심볼릭 링크가 수십 개 있다. 일반 zip 으로 묶으면
          # 링크가 실제 파일로 복사되거나 권한이 날아가 앱이 안 열린다.
          # ditto 는 번들 구조를 그대로 보존한다.
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "trendletter-macos-${{ matrix.arch }}.zip"
          ls -lh "trendletter-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: trendletter-macos-${{ matrix.arch }}
          path: trendletter-macos-${{ matrix.arch }}.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: 무엇이 올라가는지
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            ## 윈도우

            `trendletter-windows.zip` 을 받아 **압축을 풀고** `trendletter.exe` 를
            실행하세요. 파이썬은 필요 없습니다.

            - 압축 안에서 바로 실행하면 안 됩니다. 풀어서 폴더째 두고 여세요
            - "Windows의 PC 보호" 가 뜨면 → **추가 정보 → 실행**
            - 검은 창이 뜨고 브라우저가 열립니다. 창을 닫으면 종료됩니다

            ## 맥

            칩에 맞는 것을 받으세요. **모르겠으면** 애플 메뉴 →
            «이 Mac에 관하여» 에서 확인합니다.

            | 칩 | 받을 것 |
            | --- | --- |
            | Apple M1 이후 | `trendletter-macos-arm64.zip` |
            | Intel | `trendletter-macos-intel.zip` |

            압축을 풀면 `동향지.app` 이 나옵니다. 처음 열 때는
            **오른쪽 클릭 → 열기 → 열기** 로 여세요. 그냥 더블클릭하면
            "확인되지 않은 개발자" 라며 막힙니다. 한 번만 하면 됩니다.

            ## 처음 열면

            설정 화면부터 나옵니다. 맨 위 칸에 한두 문장 적으면
            키워드·수집원·관련도를 한 번에 제안받을 수 있습니다.

            > 해양 안전과 선박 사고 예방을 다루는 동향지.
            > 우리는 해양경찰청이고 현장 구조·단속 업무에 닿는 소식이 중요하다.

            ## 어디에 쌓이나

            설정과 산출물은 프로그램 안이 아니라 사용자 폴더에 쌓입니다.
            프로그램을 새로 받아도 설정은 그대로 남습니다.

            | | |
            | --- | --- |
            | 맥 | `~/Library/Application Support/동향지` |
            | 윈도우 | `%APPDATA%\동향지` |
