# 윈도우 실행 파일 만들기.
#
# PyInstaller 는 크로스 컴파일이 안 된다. 맥에서 윈도우 exe 를 만들 수 없어
# 윈도우 러너에서 만든다.
#
# README 가 GitHub Actions 를 배제한 것은 '초안을 액션에서 만들지 않는다'는
# 뜻이다. 검토 없이 나간 초안이 전 직원에게 갈 수 있기 때문이다.
# 여기서 하는 일은 빌드뿐이라 초안 유출과 무관하다. 수집도 하지 않고
# 설정 파일(secrets.yaml)도 저장소에 없다.

name: 윈도우 실행 파일

on:
  # 태그를 밀면 만들어서 Releases 에 올린다.
  push:
    tags: ["v*"]
  # 여기에 밀면 만들어만 본다 (artifact 는 공개되지 않는다).
  # 윈도우 빌드는 맥에서 확인할 방법이 없어, 깨진 걸 태그 밀 때 알면 늦다.
  # paths 로 좁히지 않는다 — tags 와 함께 쓰면 태그 빌드가 조용히 건너뛰어진다.
    branches: ["universal", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 실행 파일 만들기
        run: pyinstaller --noconfirm --clean installer/trendletter.spec

      - name: 제대로 나왔는지 확인
        shell: pwsh
        run: |
          # 폴더 이름이 한글이라 러너의 코드페이지에 따라 경로가 어긋날 수 있다.
          # 이름을 적지 말고 찾아 쓴다.
          $dir = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $dir) { throw "dist 에 아무것도 없습니다" }
          $exe = Get-ChildItem $dir.FullName -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "실행 파일이 없습니다" }
          Write-Host "만들어짐: $($exe.FullName)  ($([math]::Round($exe.Length/1MB,1)) MB)"
          # 비밀 파일이 딸려 갔는지 본다. 한 번이라도 새면 되돌릴 수 없다.
          $leak = Get-ChildItem $dir.FullName -Recurse -Filter secrets.yaml
          if ($leak) { throw "secrets.yaml 이 배포물에 들어 있습니다" }
          "BUILD_DIR=$($dir.FullName)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: 압축
        shell: pwsh
        run: Compress-Archive -Path "$env:BUILD_DIR/*" -DestinationPath "trendletter-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: trendletter-windows
          path: trendletter-windows.zip

      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: trendletter-windows.zip
          body: |
            내려받아 압축을 풀고 `동향지.exe` 를 실행하세요.
            파이썬은 필요 없습니다.

            설정과 산출물은 `%APPDATA%\동향지` 에 쌓입니다.
            프로그램을 새로 받아도 설정은 그대로 남습니다.
