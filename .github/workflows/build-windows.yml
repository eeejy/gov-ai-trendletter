# 윈도우 실행 파일 만들기.
#
# PyInstaller 는 크로스 컴파일이 안 된다. 맥에서 윈도우 exe 를 만들 수 없어
# 윈도우 러너에서 만든다.
#
# README 가 GitHub Actions 를 배제한 것은 '초안을 액션에서 만들지 않는다'는
# 뜻이다. 검토 없이 나간 초안이 전 직원에게 갈 수 있기 때문이다.
# 여기서 하는 일은 빌드뿐이라 초안 유출과 무관하다. 수집도 하지 않고
# 설정 파일(secrets.yaml)도 저장소에 없다.

name: 윈도우 실행 파일

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 실행 파일 만들기
        run: pyinstaller --noconfirm --clean installer/trendletter.spec

      - name: 압축
        run: Compress-Archive -Path "dist/동향지/*" -DestinationPath "동향지-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: 동향지-windows
          path: 동향지-windows.zip

      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 동향지-windows.zip
          body: |
            내려받아 압축을 풀고 `동향지.exe` 를 실행하세요.
            파이썬은 필요 없습니다.

            설정과 산출물은 `%APPDATA%\동향지` 에 쌓입니다.
            프로그램을 새로 받아도 설정은 그대로 남습니다.
